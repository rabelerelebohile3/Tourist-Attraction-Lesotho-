<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <title>Contact and booking</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-success">
                <div class="container">
                    <a class="navbar-brand" href="index.html">Lesotho Tourism</a>

                    <button class="navbar-toggler" data-bs-target="#menu" data-bs-toggle="collapse" type="button">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="menu">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="about.html">About</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="destinations.html">Destinations</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="gallery.html">Gallery</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="contact.html">Contact</a>
                            </li>
                        </ul>

                        <button class="btn btn-light btn-sm ms-lg-3" id="themeButton">Dark mode</button>
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section class="container mt-5 mb-5">
                <h1>Contact and bookings</h1>
                <p>Please complete this form to make a booking enquiry.</p>

                <div class="row">
                    <div class="col-md-8">
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label" for="name">Full name</label>
                                <input class="form-control" id="name" required type="text">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Email address</label>
                                <input class="form-control" id="email" required type="email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="phone">Phone number</label>
                                <input class="form-control" id="phone" required type="tel">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="date">Date of visit</label>
                                <input class="form-control" id="date" required type="date">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="destination">Destination</label>
                                <select class="form-select" id="destination" required>
                                    <option value="">Choose destination</option>
                                    <option>Maletsunyane Falls</option>
                                    <option>Katse Dam</option>
                                    <option>Thaba Bosiu Heritage Site</option>
                                    <option>Sehlabathebe National Park</option>
                                    <option>Afriski</option>
                                    <option>Liphofung Cave</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="people">Number of people</label>
                                <input class="form-control" id="people" max="50" min="1" required type="number">
                            </div>

                            <button class="btn btn-success" type="submit">Submit booking</button>
                        </form>

                        <p class="mt-3" id="message"></p>

                        <hr class="my-5">

                        <h2>Send us a message</h2>

                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label" for="contactName">Your name</label>
                                <input class="form-control" id="contactName" required type="text">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="contactEmail">Email address</label>
                                <input class="form-control" id="contactEmail" required type="email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="subject">Subject</label>
                                <input class="form-control" id="subject" required type="text">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="contactText">Message</label>
                                <textarea class="form-control" id="contactText" required rows="4"></textarea>
                            </div>

                            <button class="btn btn-outline-success" type="submit">Send message</button>
                        </form>

                        <p class="mt-3" id="contactMessage"></p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="bg-success text-white text-center p-3 mt-5">
            © 2026 Lesotho Tourism
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body                              
</html>
